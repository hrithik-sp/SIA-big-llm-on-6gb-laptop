<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="Intelligence vs speed" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect width="760" height="440" rx="12" fill="#fcfcfb"/><text x="24.0" y="34.0" fill="#0b0b0b" font-size="17" font-weight="600" text-anchor="start">Intelligence vs speed on a 6 GB laptop GPU</text><text x="24.0" y="56.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="start">MMLU-Pro accuracy (210 questions, ±1 s.e.) vs generation speed, best measured setup</text><line x1="70" x2="720" y1="338.7" y2="338.7" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="342.7" fill="#898781" font-size="12" font-weight="400" text-anchor="end">65%</text><line x1="70" x2="720" y1="286.6" y2="286.6" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="290.6" fill="#898781" font-size="12" font-weight="400" text-anchor="end">70%</text><line x1="70" x2="720" y1="234.4" y2="234.4" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="238.4" fill="#898781" font-size="12" font-weight="400" text-anchor="end">75%</text><line x1="70" x2="720" y1="182.3" y2="182.3" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="186.3" fill="#898781" font-size="12" font-weight="400" text-anchor="end">80%</text><line x1="70" x2="720" y1="130.1" y2="130.1" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="134.1" fill="#898781" font-size="12" font-weight="400" text-anchor="end">85%</text><line x1="70" x2="720" y1="78.0" y2="78.0" stroke="#e1e0d9" stroke-width="1"/><text x="60.0" y="82.0" fill="#898781" font-size="12" font-weight="400" text-anchor="end">90%</text><text x="70.0" y="392.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">0</text><text x="232.5" y="392.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">10</text><text x="395.0" y="392.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">20</text><text x="557.5" y="392.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">30</text><text x="720.0" y="392.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">40</text><line x1="70" x2="720" y1="370" y2="370" stroke="#c3c2b7" stroke-width="1"/><text x="395.0" y="418.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">tokens per second (higher is faster; ~25 is faster than reading)</text><line x1="520.1" x2="520.1" y1="249.0" y2="313.7" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" opacity="0.55"/><circle cx="520.1" cy="281.4" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="506.1" y="277.4" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="end">gpt-oss-20b  70.5% · 27.7 tok/s</text><text x="506.1" y="294.4" fill="#52514e" font-size="12" font-weight="400" text-anchor="end">released MXFP4, nothing shrunk</text><line x1="578.6" x2="578.6" y1="163.5" y2="221.9" stroke="#eb6834" stroke-width="2" stroke-linecap="round" opacity="0.55"/><circle cx="578.6" cy="192.7" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="564.6" y="188.7" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="end">Gemma 4 26B QAT  79.0% · 31.3 tok/s</text><text x="564.6" y="205.7" fill="#52514e" font-size="12" font-weight="400" text-anchor="end">Google's 4-bit-trained, + MTP</text><line x1="265.0" x2="265.0" y1="116.6" y2="168.7" stroke="#1baf7a" stroke-width="2" stroke-linecap="round" opacity="0.55"/><circle cx="265.0" cy="142.7" r="6" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="279.0" y="138.7" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start">Gemma 4 26B Q8_0  83.8% · 12.0 tok/s</text><text x="279.0" y="155.7" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">near-lossless, streamed from SSD, + MTP</text></svg>
