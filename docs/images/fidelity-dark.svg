<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-label="Fidelity to the original" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect width="760" height="290" rx="12" fill="#1a1a19"/><text x="24.0" y="34.0" fill="#f0efec" font-size="17" font-weight="600" text-anchor="start">How far each version's predictions are from the original</text><text x="24.0" y="56.0" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">KL-divergence vs the near-lossless Q8_0 on chat text (lower = closer)</text><circle cx="29" cy="76" r="5" fill="#3987e5"/><text x="40.0" y="80.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">post-hoc quantization (lossy)</text><circle cx="258" cy="76" r="5" fill="#d95926"/><text x="269.0" y="80.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Google QAT (4-bit-trained)</text><text x="190.0" y="100.0" fill="#c3c2b7" font-size="12" font-weight="600" text-anchor="start">average token</text><text x="176.0" y="127.0" fill="#f0efec" font-size="12" font-weight="400" text-anchor="end">UD-Q3_K_M (lossy)</text><path d="M190,112 H263.28 Q267.28,112 267.28,116 V128 Q267.28,132 263.28,132 H190 Z" fill="#3987e5"/><text x="273.3" y="127.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">0.092</text><text x="176.0" y="161.0" fill="#f0efec" font-size="12" font-weight="400" text-anchor="end">UD-IQ3_XXS (lossy)</text><path d="M190,146 H300.24 Q304.24,146 304.24,150 V162 Q304.24,166 300.24,166 H190 Z" fill="#3987e5"/><text x="310.2" y="161.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">0.136</text><text x="176.0" y="195.0" fill="#f0efec" font-size="12" font-weight="400" text-anchor="end">UD-IQ2_M (lossy)</text><path d="M190,180 H356.52 Q360.52,180 360.52,184 V196 Q360.52,200 356.52,200 H190 Z" fill="#3987e5"/><text x="366.5" y="195.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">0.203</text><text x="176.0" y="229.0" fill="#f0efec" font-size="12" font-weight="400" text-anchor="end">QAT Q4_0 (Google)</text><path d="M190,214 H359.88 Q363.88,214 363.88,218 V230 Q363.88,234 359.88,234 H190 Z" fill="#d95926"/><text x="369.9" y="229.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">0.207</text><line x1="190" x2="190" y1="106" y2="248" stroke="#383835"/><text x="480.0" y="100.0" fill="#c3c2b7" font-size="12" font-weight="600" text-anchor="start">worst 0.1% of tokens</text><path d="M480,112 H581.65625 Q585.65625,112 585.65625,116 V128 Q585.65625,132 581.65625,132 H480 Z" fill="#3987e5"/><text x="591.7" y="127.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">8.1</text><path d="M480,146 H627.85625 Q631.85625,146 631.85625,150 V162 Q631.85625,166 627.85625,166 H480 Z" fill="#3987e5"/><text x="637.9" y="161.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">11.6</text><path d="M480,180 H662.375 Q666.375,180 666.375,184 V196 Q666.375,200 662.375,200 H480 Z" fill="#3987e5"/><text x="672.4" y="195.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">14.2</text><path d="M480,214 H573.25625 Q577.25625,214 577.25625,218 V230 Q577.25625,234 573.25625,234 H480 Z" fill="#d95926"/><text x="583.3" y="229.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">7.4</text><line x1="480" x2="480" y1="106" y2="248" stroke="#383835"/><text x="24.0" y="256.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">QAT differs as much as 2-bit on average, but its worst cases are half as far: a re-trained model, not a damaged copy.</text><text x="24.0" y="276.0" fill="#898781" font-size="11" font-weight="400" text-anchor="start">~37 chunks of 512 tokens in the model's own chat template (findings 30-32)</text></svg>
